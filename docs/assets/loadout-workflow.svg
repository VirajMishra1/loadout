<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      text{font-family:"Comic Sans MS","Chalkboard SE","Comic Neue",cursive}
      .h1{font-size:38px;font-weight:700;fill:#111827}
      .hd{font-size:23px;font-weight:700}
      .sub{font-size:15px;fill:#6b7280}
      .lb{font-size:16px;fill:#1f2937}
      .sm{font-size:14px;fill:#4b5563}
      .xs{font-size:12.5px;fill:#6b7280}
      .mono{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;fill:#374151}
      .box{fill:#fff;stroke-width:2.5}
    </style>
  </defs>

  <rect width="1400" height="780" fill="#fff"/>
  <text x="700" y="58" class="h1" text-anchor="middle">One Screened Library. The Right Tools per Project.</text>

  <!-- DISCOVER -->
  <rect x="40" y="96" width="330" height="330" rx="20" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="205" y="132" class="hd" fill="#7c3aed" text-anchor="middle">DISCOVER</text>
  <text x="205" y="155" class="sub" text-anchor="middle">5 sources, checked daily</text>
  <g>
    <rect class="box" x="66" y="172" width="278" height="38" rx="10" stroke="#c4b5fd"/>
    <text x="82" y="196" class="mono">GitHub topic search</text>
    <rect class="box" x="66" y="220" width="278" height="38" rx="10" stroke="#c4b5fd"/>
    <text x="82" y="244" class="mono">MCP registry</text>
    <rect class="box" x="66" y="268" width="278" height="38" rx="10" stroke="#c4b5fd"/>
    <text x="82" y="292" class="mono">skills.sh index</text>
    <rect class="box" x="66" y="316" width="278" height="38" rx="10" stroke="#c4b5fd"/>
    <text x="82" y="340" class="mono">Hacker News</text>
    <rect class="box" x="66" y="364" width="278" height="38" rx="10" stroke="#c4b5fd"/>
    <text x="82" y="388" class="mono">your own orgs (opt-in)</text>
  </g>
  <path d="M348 191 C 400 191 400 250 424 261" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
  <path d="M348 239 C 400 239 400 252 424 258" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
  <path d="M348 287 C 395 287 400 261 424 261" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
  <path d="M348 335 C 400 335 400 275 424 265" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
  <path d="M348 383 C 400 383 402 285 424 268" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arp)"/>

  <!-- SCREEN gate -->
  <rect x="452" y="150" width="230" height="222" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="567" y="186" class="hd" fill="#2563eb" text-anchor="middle">SCREEN</text>
  <text x="567" y="208" class="sub" text-anchor="middle">a human decides</text>
  <text x="474" y="240" class="mono">review-queue</text>
  <text x="474" y="266" class="mono">inspect</text>
  <text x="474" y="292" class="mono">propose</text>
  <text x="474" y="318" class="mono">promote</text>
  <text x="567" y="352" class="xs" text-anchor="middle" fill="#2563eb">nothing auto-promotes</text>
  <line x1="690" y1="261" x2="726" y2="261" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- LIBRARY -->
  <rect x="734" y="118" width="290" height="286" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="879" y="158" class="hd" fill="#16a34a" text-anchor="middle">LOADOUT</text>
  <text x="879" y="180" class="sub" text-anchor="middle">screened extension library</text>
  <!-- books -->
  <g stroke="#16a34a" stroke-width="2.5" fill="#fff">
    <rect x="800" y="200" width="22" height="62" rx="3"/>
    <rect x="826" y="192" width="22" height="70" rx="3"/>
    <rect x="852" y="204" width="22" height="58" rx="3"/>
    <rect x="878" y="196" width="22" height="66" rx="3"/>
    <rect x="904" y="208" width="22" height="54" rx="3"/>
    <line x1="792" y1="264" x2="934" y2="264" stroke-width="3"/>
  </g>
  <text x="838" y="234" font-size="18" fill="#16a34a">★</text>
  <rect class="box" x="762" y="284" width="234" height="34" rx="10" stroke="#86efac"/>
  <text x="879" y="307" class="sm" text-anchor="middle">53 repos, pinned to a commit</text>
  <rect class="box" x="762" y="326" width="234" height="60" rx="10" stroke="#86efac"/>
  <text x="879" y="348" class="sm" text-anchor="middle">Stable 30 · Power 56</text>
  <text x="879" y="372" class="sm" text-anchor="middle">Maximum: all, kept disabled</text>
  <line x1="1032" y1="261" x2="1068" y2="261" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- MATCH -->
  <rect x="1076" y="96" width="290" height="330" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="1221" y="132" class="hd" fill="#ea580c" text-anchor="middle">MATCH</text>
  <text x="1221" y="155" class="sub" text-anchor="middle">reads your actual repo</text>
  <g>
    <rect class="box" x="1100" y="174" width="132" height="36" rx="10" stroke="#fdba74"/>
    <text x="1116" y="198" class="lb">TypeScript</text>
    <rect class="box" x="1100" y="218" width="132" height="36" rx="10" stroke="#fdba74"/>
    <text x="1116" y="242" class="lb">Next.js</text>
    <rect class="box" x="1100" y="262" width="132" height="36" rx="10" stroke="#fdba74"/>
    <text x="1116" y="286" class="lb">Zod</text>
    <rect class="box" x="1100" y="306" width="132" height="36" rx="10" stroke="#fdba74"/>
    <text x="1116" y="330" class="lb">Vitest</text>
  </g>
  <path d="M1236 192 C 1260 192 1264 236 1276 244" stroke="#ea580c" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
  <path d="M1236 236 C 1258 236 1262 242 1276 246" stroke="#ea580c" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
  <path d="M1236 280 C 1258 280 1262 258 1276 250" stroke="#ea580c" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
  <path d="M1236 324 C 1260 324 1264 266 1276 253" stroke="#ea580c" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#aro)"/>
  <rect x="1284" y="196" width="70" height="112" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1319" y="222" class="xs" fill="#16a34a" text-anchor="middle" font-weight="700">ACTIVE</text>
  <g stroke="#16a34a" stroke-width="2" fill="none">
    <circle cx="1301" cy="244" r="7"/><path d="M1297 244 l3 3 l5 -6"/>
    <circle cx="1301" cy="268" r="7"/><path d="M1297 268 l3 3 l5 -6"/>
    <circle cx="1301" cy="292" r="7"/><path d="M1297 292 l3 3 l5 -6"/>
  </g>
  <g stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round">
    <line x1="1315" y1="244" x2="1345" y2="244"/>
    <line x1="1315" y1="268" x2="1345" y2="268"/>
    <line x1="1315" y1="292" x2="1345" y2="292"/>
  </g>

  <!-- fan-out -->
  <path d="M879 404 L879 452 M1319 316 L1319 430 L879 430" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  <path d="M150 452 L1250 452" stroke="#1f2937" stroke-width="2.5"/>
  <g stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="150" y1="452" x2="150" y2="494"/><line x1="333" y1="452" x2="333" y2="494"/>
    <line x1="516" y1="452" x2="516" y2="494"/><line x1="699" y1="452" x2="699" y2="494"/>
    <line x1="882" y1="452" x2="882" y2="494"/><line x1="1065" y1="452" x2="1065" y2="494"/>
    <line x1="1250" y1="452" x2="1250" y2="494"/>
  </g>
  <g>
    <rect class="box" x="72" y="500" width="156" height="48" rx="12" stroke="#2563eb"/>
    <text x="150" y="530" class="lb" fill="#1d4ed8" text-anchor="middle">Claude Code</text>
    <rect class="box" x="255" y="500" width="156" height="48" rx="12" stroke="#2563eb"/>
    <text x="333" y="530" class="lb" fill="#1d4ed8" text-anchor="middle">Codex</text>
    <rect class="box" x="438" y="500" width="156" height="48" rx="12" stroke="#2563eb"/>
    <text x="516" y="530" class="lb" fill="#1d4ed8" text-anchor="middle">Cursor</text>
    <rect class="box" x="621" y="500" width="156" height="48" rx="12" stroke="#2563eb"/>
    <text x="699" y="530" class="lb" fill="#1d4ed8" text-anchor="middle">Gemini CLI</text>
    <rect class="box" x="804" y="500" width="156" height="48" rx="12" stroke="#2563eb"/>
    <text x="882" y="530" class="lb" fill="#1d4ed8" text-anchor="middle">Copilot</text>
    <rect class="box" x="987" y="500" width="156" height="48" rx="12" stroke="#2563eb"/>
    <text x="1065" y="530" class="lb" fill="#1d4ed8" text-anchor="middle">Windsurf</text>
    <rect class="box" x="1172" y="500" width="156" height="48" rx="12" stroke="#93c5fd"/>
    <text x="1250" y="530" class="lb" fill="#60a5fa" text-anchor="middle">+ 6 more</text>
  </g>

  <!-- while you work -->
  <rect x="72" y="586" width="1256" height="96" rx="20" fill="#fdf4ff" stroke="#c026d3" stroke-width="2.5"/>
  <text x="700" y="618" class="hd" fill="#c026d3" text-anchor="middle" font-size="20">then, while you work</text>
  <text x="243" y="650" class="lb" text-anchor="middle" font-weight="700">Route</text>
  <text x="243" y="672" class="sm" text-anchor="middle">right model, real price</text>
  <text x="700" y="650" class="lb" text-anchor="middle" font-weight="700">Handoff</text>
  <text x="700" y="672" class="sm" text-anchor="middle">pass work between agents</text>
  <text x="1157" y="650" class="lb" text-anchor="middle" font-weight="700">Skills</text>
  <text x="1157" y="672" class="sm" text-anchor="middle">ask your agent, not a terminal</text>

  <!-- footer -->
  <rect x="330" y="706" width="740" height="46" rx="23" fill="#fffbeb" stroke="#1f2937" stroke-width="2.5"/>
  <text x="700" y="736" class="lb" text-anchor="middle">Preview first · Snapshot always · Undo anytime</text>
</svg>
